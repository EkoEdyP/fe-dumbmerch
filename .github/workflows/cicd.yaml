name: CI/CD Frontend

on:
  push:
    branches:
      - Production

jobs:
  # ── Stage 1: SonarQube Code Quality ───────────────────
  sonarqube:
    name: SonarQube Analysis
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ── Stage 2: Build & Push Image to ECR ────────────────
  build:
    name: Build and Push Image
    runs-on: self-hosted
    needs: sonarqube
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: finaltask/private-registry
          IMAGE_TAG: fe-dumbmerch
        run: |
          docker build \
            --build-arg REACT_APP_BASEURL=${{ secrets.REACT_APP_BASEURL }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/finaltask/private-registry:fe-dumbmerch
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

  # ── Stage 3: Deploy to Appserver ──────────────────────
  deploy:
    name: Deploy to Appserver
    runs-on: self-hosted
    needs: build
    steps:
      - name: SSH and redeploy frontend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.APPSERVER_HOST }}
          username: finaltask-ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 6969
          script: |
            # Login to ECR
            aws ecr get-login-password --region ap-southeast-1 | \
            docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            # Pull latest image
            docker pull ${{ secrets.ECR_REGISTRY }}/finaltask/private-registry:fe-dumbmerch

            # Redeploy containers
            cd /home/finaltask-ubuntu/app
            docker compose up -d --no-deps fe-1 fe-2

      - name: Test deployment with wget spider
        run: |
          wget --spider --tries=3 --timeout=10 https://ekoedyp.studentdumbways.my.id
          echo "Frontend deployment verified ✅"